<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Conectado</title>

<style>
body {
	background-color: #f4f4f4;
	color: #222;
	margin: 0;
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.offset {
	background: #ffffffcc;
	border-radius: 16px;
	margin: 0 auto;
	max-width: 600px;
	padding: 20px;
	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.insert {
	background: #fafafa;
	border: 1px solid #e0e0e0;
	border-radius: 12px;
	padding: 20px;
}

.insert > h1 {
	font-size: 1.5em;
	margin: 0 0 20px;
	color: #333;
	text-align: center;
}

img {
	display: block;
	width: 100px;
	margin: 0 auto 20px;
	border-radius: 8px;
}

.botao {
	display: block;
	width: 100%;
	text-align: center;
	font-size: 1em;
	padding: 12px;
	border-radius: 8px;
	background-color: #007bff;
	color: white;
	font-weight: bold;
	text-decoration: none;
	margin-top: 15px;
	transition: background-color 0.3s ease;
}

.botao:hover {
	background-color: #0056b3;
}

.mensagem {
	text-align: center;
	font-size: 1em;
	margin-bottom: 10px;
}

.terms-link {
	display: block;
	text-align: center;
	margin-top: 15px;
	font-size: 0.9em;
}

.terms-link a {
	color: #007bff;
	text-decoration: none;
}

.terms-link a:hover {
	text-decoration: underline;
}

copy-right {
	display: block;
	text-align: center;
	font-size: 0.75em;
	color: #999;
	font-style: italic;
	margin-top: 20px;
}
</style>

</head>

<body>

<div class="offset">
	<div class="insert">
		<img src="logo_sm.jpg" alt="Logo Wi-Fi">
		<hr>
		<div class="mensagem">
			<h2>✅ Conectado com sucesso!</h2>
			<p>Você já pode navegar na internet.</p>
			<p>Se esta tela não fechar automaticamente, você pode fechá-la.</p>
		</div>
		<hr>
		<copy-right>Wi-Fi gratuito oferecido por Supermercados do Papai</copy-right>
	</div>
</div>
</body>
</html>
